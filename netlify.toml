[build]
  command = "npm ci && npm run build:css && hugo --gc --minify"
  publish = "public"

  [build.environment]
    HUGO_VERSION = "0.125.7"
    NODE_VERSION = "20.11.1"

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

# Legacy pages that dilute the accounting/IFRS entity are permanently redirected
# to the current information architecture. Keep robots access enabled so crawlers
# can see the 301 responses and consolidate old URLs instead of retaining stale copy.
[[redirects]]
  from = "/en/apps/"
  to = "/en/services/"
  status = 301
  force = true

[[redirects]]
  from = "/ru/apps/"
  to = "/ru/services/"
  status = 301
  force = true

