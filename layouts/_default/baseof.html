<!DOCTYPE html>
<html lang="{{ .Lang }}">
  <head>
    {{ partial "head.html" . }}
    <link rel="icon" type="image/png" href="{{ "faviconA.png" | relURL }}">

    <script>
      window.dataLayer = window.dataLayer || [];
      window.ACCOUNTANT_PRIVACY = {
        gtmId: "GTM-PSQ6T2B9",
        analyticsSrc: "https://a.antonov.app/tracker.js",
        analyticsProject: "accountantandco",
        analyticsEndpoint: "https://a.antonov.app"
      };
    </script>
  </head>
<body class="dark-theme">
  {{ partial "navbar.html" . }}
  {{ partial "cookie-banner.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <script src="{{ "js/cookie-consent.js" | relURL }}" defer></script>
  {{ $effects := resources.Get "js/effects.js" | resources.Minify }}
  <script src="{{ $effects.RelPermalink }}" defer></script>
  <script src="/js/back-to-top.js" defer></script>

  {{ if .IsHome }}
  <a href="#" id="backToTopBtn" class="back-to-top-button" title="Наверх" aria-label="Вернуться наверх">↑</a>
  {{ end }}
</body>
</html>
